ref: attune.pack_sync_workflows
label: "Sync Pack Workflows"
description: "Sync workflow files from a pack's filesystem contents into the database"
enabled: true
runner_type: python
entry_point: pack_sync_workflows.py
parameter_delivery: stdin
parameter_format: json
output_format: json

parameters:
  pack_ref:
    type: string
    description: "Pack ref to sync"
    required: true
  api_url:
    type: string
    description: "Attune API base URL"
  api_token:
    type: string
    description: "Bearer token for the target Attune API"
    secret: true
  verify_ssl:
    type: boolean
    description: "Verify TLS certificates"
    default: true
  timeout:
    type: integer
    description: "Request timeout in seconds"
    default: 30

output_schema:
  success:
    type: boolean
  data:
    type: object
    description: "Generated-client response payload"

tags:
  - attune
  - pack
  - workflow
  - api
