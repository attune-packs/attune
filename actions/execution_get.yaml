ref: attune.execution_get
label: "Get Execution"
description: "Fetch a single Attune execution by ID"
enabled: true
runner_type: python
entry_point: execution_get.py
parameter_delivery: stdin
parameter_format: json
output_format: json

parameters:
  credential_key: { type: string, description: "Optional pack.attune.* Key containing external Attune credentials" }
  execution_id:
    type: integer
    description: "Execution ID"
    required: true
  api_url:
    type: string
    description: "Attune API base URL"
  api_token:
    type: string
    description: "Bearer token for the target Attune API"
    secret: true
  verify_ssl:
    type: boolean
    description: "Verify TLS certificates"
    default: true
  timeout:
    type: integer
    description: "Request timeout in seconds"
    default: 30

output_schema:
  success:
    type: boolean
  data:
    type: object
    description: "Generated-client response payload"

tags:
  - attune
  - execution
  - api
