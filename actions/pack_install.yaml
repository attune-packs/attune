ref: attune.pack_install
label: "Install Pack"
description: "Install a pack from a remote source"
enabled: true
runner_type: python
entry_point: dispatch.py
parameter_delivery: stdin
parameter_format: json
output_format: json
parameters:
  source: { type: string, required: true, description: "Repository URL or source location" }
  ref_spec: { type: string, description: "Branch, tag, or commit" }
  skip_deps: { type: boolean, description: "Skip dependency validation" }
  skip_tests: { type: boolean, description: "Skip tests" }
  api_url: { type: string, description: "Attune API base URL" }
  api_token: { type: string, description: "Bearer token", secret: true }
  verify_ssl: { type: boolean, default: true, description: "Verify TLS certificates" }
  timeout: { type: integer, default: 30, description: "Request timeout in seconds" }
output_schema:
  success: { type: boolean }
  data: { type: object, description: "Generated-client response payload" }
tags: [attune, pack, api]
